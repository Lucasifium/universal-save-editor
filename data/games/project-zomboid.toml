name = "Project Zomboid"
tab = "Survivors"
accent = [170, 60, 50]
kind = "Project Zomboid players.db"
markers = ["/About/Characters"]
subtitle = '''players.db from Zomboid\Saves\<mode>\<save name> (the save's folder). Every character's hours survived, kills, weight and death flag, their needs and conditions, the health of each body part, and every skill's level and experience. Close the game first. To bring a dead character back, untick Dead and raise the body parts' health.'''

[[tables]]
title = "Characters"
path = "/Characters"
name = []
cols = [
    ["Hours survived", "/Hours survived"],
    ["Zombie kills", "/Zombie kills"],
    ["Survivor kills", "/Survivor kills"],
    ["Weight (kg)", "/Weight (kg)"],
    ["Dead", "/Dead"],
]

[[tables]]
