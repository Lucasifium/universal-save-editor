name = "Middle-earth: Shadow of War"
tab = "Statistics"
accent = [185, 150, 70]
kind = "Shadow of War save"
markers = ["/Statistics/TotalMirian", "/Statistics/Kills"]
subtitle = '''<user id>_ShadowOfWar.sav from Steam\userdata\<account>\356190\remote (or %LOCALAPPDATA%\WB Games\Shadow of War; the _1 to _5 files are the game's own backups). The game's lifetime statistics: Mirian and skill points earned, levels, quests, gear, kills of every enemy kind, how you kill, and the orcs you branded, dominated and recruited. Your current Mirian, XP, gear and orcs are not mapped yet. The save is decrypted with the user id in its file name and encrypted again with its checksum written. Close the game first and turn Steam Cloud off.'''
tiles = [
    ["Mirian earned", "/Statistics/TotalMirian"],
    ["Highest level reached", "/Statistics/MaxLevelReached"],
    ["Skill points earned", "/Statistics/TotalSkillPoints"],
    ["Total kills", "/Statistics/Kills"],
]

[[sections]]
title = "Progress"
rows = [
    ["Mirian earned", "/Statistics/TotalMirian"],
    ["Skill points earned", "/Statistics/TotalSkillPoints"],
    ["Highest level reached", "/Statistics/MaxLevelReached"],
    ["Skills unlocked", "/Statistics/PlayerSkillsUnlocked"],
