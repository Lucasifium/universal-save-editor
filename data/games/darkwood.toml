name = "Darkwood"
tab = "Survivor"
accent = [150, 110, 70]
markers = ["/pS/health", "/pS/experience", "/iS/invItems"]
subtitle = '''sav.dat from AppData\LocalLow\Acid Wizard Studio\Darkwood\prof1 (one prof folder per profile; the _bak copies and the other .dat files are not needed). Your level, experience, health, stamina and karma, the day and workbench level, and the items in your backpack and hotbar. Close the game first.'''
tiles = [
    ["Level", "/pS/currentLevel"],
    ["Experience", "/pS/experience"],
    ["Karma", "/flaS/karmaPoints"],
    ["Day", "/cnS/day"],
]

[[sections]]
title = "Survivor"
rows = [
    ["Level", "/pS/currentLevel"],
    ["Experience", "/pS/experience"],
    ["Health", "/pS/health"],
    ["Stamina", "/pS/stamina"],
    ["Lives", "/pS/lifes"],
]

[[sections]]
title = "World"
rows = [
    ["Karma", "/flaS/karmaPoints"],
    ["Day", "/cnS/day"],
    ["Workbench level", "/cnS/workbenchLevel"],
]

