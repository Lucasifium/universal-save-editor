name = "Underrail"
tab = "Character"
accent = [200, 150, 60]
kind = ".NET BinaryFormatter (TG)"
markers = ["/TG:PC/C1:N", "/TG:PC/PC1:E"]
subtitle = '''A saved game of Underrail (the save file packs a header and gzip around the character data; both are opened and closed again for you). The character's level, experience, unspent points and attributes. Skills, feats, items and the world are in the Tree. Close the game first.'''
tiles = [
    ["Level", "/TG:PC/C1:L"],
    ["Experience", "/TG:PC/PC1:E"],
]

[[sections]]
title = "Character"
rows = [
    ["Level", "/TG:PC/C1:L"],
    ["Experience", "/TG:PC/PC1:E"],
    ["Unspent attribute points", "/TG:PC/PC1:BAPC"],
    ["Unspent skill points", "/TG:PC/PC1:SPC"],
    ["Unspent feat points", "/TG:PC/PC1:FC"],
]

