[package]
name = "universal_save_editor"
version = "0.6.1"
edition = "2021"
description = "Universal Save Editor: a free, offline save editor and manager (with backups and restore) for 340+ (350) PC games"
license = "GPL-3.0-or-later"
repository = "https://github.com/Lucasifium/universal-save-editor"

[lib]
name = "universal_save_editor"
path = "src/lib.rs"

[[bin]]
name = "UniversalSaveEditor"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
flate2 = "1"
# RE Engine "Mandarin" saves (Onimusha: Way of the Sword, Dragon's Dogma 2, MH Wilds…) use modular arithmetic on 256-bit keys.
num-bigint = "0.4"
num-integer = "0.1"
base64 = "0.22"
lz-str = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Re-signing Ren'Py 8.1+ saves with the player's own local key (ECDSA P-256 / SHA-1).
p256 = "0.13"
sha1 = "0.10"
# Structured formats.
toml_edit = "0.22"
serde_yaml = "0.9"
plist = "1"
rmpv = "1"
bson = "2"
# The system language, to show the interface in it.
sys-locale = "0.3"
# Extra compression wrappers.
zstd = "0.13"
lz4_flex = "0.11"
lzma-rs = "0.3"
# Pure-Rust bzip2 (also builds for the browser version).
bzip2 = "0.6"
# Encrypted saves (Easy Save 3, Godot).
aes = "0.8"
# Ciphers used by console cheat patches (Apollo scripts).
blowfish = "0.9"
camellia = "0.1"
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cfb-mode = "0.8"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
md-5 = "0.10"
# Valheim characters end with a SHA-512 of their data.
sha2 = "0.10"
# Resident Evil 4 (2023) checks each block of its save with SHA3-256.
sha3 = "0.10"
# Flash and AIR shared objects (.sol), read and written by Ruffle's parser.
flash-lso = "0.7"
lzokay-native = "0.1"
# More wrappers: CBOR documents, Snappy frames and Brotli streams.
ciborium = "0.2"
snap = "1"

# Not in the browser version: SQLite is C built against the platform's C library, and there
# are no installed games to load Oodle from.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# Oodle: the library games install is loaded at run time (src/oodle.rs); none of it is shipped.
libloading = "0.8"

# Native file dialogs (Android has none; the app shows its own file browser there).
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
rfd = "0.15"

# The browser version (web/): files come from the page's file picker and go back as downloads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
# The browser's language.
sys-locale = { version = "0.3", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlAnchorElement", "HtmlCanvasElement", "FileList", "File", "Blob", "BlobPropertyBag", "Url", "Event", "EventTarget"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.29", features = ["android-native-activity"] }
winit = { version = "0.30", features = ["android-native-activity"] }
jni = "0.21"

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3

# The browser version (web/build.sh, build_all.ps1 -Only web): a smaller download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
