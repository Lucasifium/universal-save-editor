# macOS can only be built on a Mac (Apple's SDK), so this job runs on GitHub's Mac machines.
# It never runs by itself (no minutes are used on push): start it from the Actions tab
# ("macOS build" > "Run workflow") when a Mac build is wanted. Every other platform, and the
# tests, are built and run locally by build_all.ps1 / cargo test.
name: macOS build

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Make SaveEditorOffline.app
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          APP=dist/SaveEditorOffline.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # One binary that runs on both kinds of Mac.
          lipo -create -output "$APP/Contents/MacOS/SaveEditorOffline" \
            target/aarch64-apple-darwin/release/SaveEditorOffline \
            target/x86_64-apple-darwin/release/SaveEditorOffline

          # Icon: PNGs written by build.rs.
          PNGS=$(dirname "$(ls target/aarch64-apple-darwin/release/build/save_editor_offline-*/out/icons/1024.png | head -1)")
          ICONSET=$(mktemp -d)/AppIcon.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            cp "$PNGS/$s.png" "$ICONSET/icon_${s}x${s}.png"
            cp "$PNGS/$((s * 2)).png" "$ICONSET/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SaveEditorOffline</string>
            <key>CFBundleDisplayName</key><string>SaveEditorOffline</string>
            <key>CFBundleIdentifier</key><string>com.saveeditoroffline.app</string>
            <key>CFBundleExecutable</key><string>SaveEditorOffline</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF

          # Ad-hoc signature: required for Apple Silicon to run it at all.
          codesign --force --deep --sign - "$APP"
          cd dist && ditto -c -k --keepParent SaveEditorOffline.app SaveEditorOffline-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SaveEditorOffline-macos
          path: dist/SaveEditorOffline-macos.zip
