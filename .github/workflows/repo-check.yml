name: Repository check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No stray working files, personal paths or attribution lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            .github/scripts/check-tracked-files.sh "$BASE"
          else
            .github/scripts/check-tracked-files.sh
          fi
      - name: No blocked names
        run: python3 .github/scripts/check-blocked-names.py
