name: Request a game
description: Ask for a game to be supported, or for more of a supported game to be editable.
labels: ["game request"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [list of supported games](https://lucasifium.github.io/universal-save-editor/) first. Games that open in the hex view can often be edited already with Value search.
  - type: input
    id: game
    attributes:
      label: Game
      placeholder: e.g. Hollow Knight
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Platform or store
      multiple: true
      options:
        - Steam
        - GOG
        - Epic Games Store
        - Xbox app / Game Pass
        - PlayStation
        - Nintendo Switch
        - Emulator
        - Other
  - type: textarea
    id: wanted
    attributes:
      label: What you'd like to edit
      description: Money, items, stats, unlocks, story progress… The more specific, the better.
    validations:
      required: true
  - type: input
    id: save-location
    attributes:
      label: Where the game keeps its saves (if you know)
      placeholder: e.g. %APPDATA%\GameName\Saves
  - type: textarea
    id: sources
    attributes:
      label: Anything that could help
      description: Links to open-source editors, wikis or modding pages that describe the save format.
