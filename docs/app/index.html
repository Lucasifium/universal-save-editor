<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Save Editor in your browser</title>
<meta name="description" content="Edit game saves in your browser with Universal Save Editor. It runs on your own computer: your save is never uploaded.">
<link rel="canonical" href="https://lucasifium.github.io/universal-save-editor/app/">
<style>
:root{--bg:#0f1217;--text:#e8ecf2;--muted:#9aa5b4;--accent:#6fbf5c}
@media (prefers-color-scheme: light){:root{--bg:#f6f7f9;--text:#14181e;--muted:#5b6573;--accent:#2f8a1f}}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
#status small{color:var(--muted);max-width:480px}
#status a{color:var(--accent)}
.spin{width:28px;height:28px;border:3px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="status">
  <div class="spin"></div>
  <div>Loading Universal Save Editor&hellip;</div>
  <small>It runs entirely in this tab: your save is read and edited on your own computer and is never uploaded.</small>
  <noscript>This page needs JavaScript and WebAssembly. You can also <a href="https://github.com/Lucasifium/universal-save-editor/releases/latest">download the app</a>.</noscript>
</div>
<script type="module">
import init, { start } from './save_editor_offline.js';
const status = document.getElementById('status');
try {
  await init();
  await start('app');
  status.remove();
} catch (e) {
  console.error(e);
  status.innerHTML = '<div>The editor couldn’t start in this browser.</div>' +
    '<small>It needs a recent browser with WebGL. You can also <a href="https://github.com/Lucasifium/universal-save-editor/releases/latest">download the app</a> for Windows, Linux or Android.</small>';
}
</script>
</body>
</html>
